[project]
name = "bald-bookmarks"
version = "0.2.0"
description = "Single-user bookmark manager with nested folders, tags, and thumbnail jobs"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "granian>=2.0.0",
    "httpx>=0.28.0",
    "oracledb>=3.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "loguru>=0.7.0",
    "playwright>=1.62.0",
    "psycopg[binary,pool]>=3.3.4",
    "mysql-connector-python>=26.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/bald_bookmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
markers = [
    "functional: live tests that start docker compose databases",
]

[tool.ruff]
target-version = "py313"
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "uvu>=0.2.5",
]
