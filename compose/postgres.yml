# Local PostgreSQL for functional driver tests. Credentials are placeholders.
name: bald-bookmarks-postgres-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookmarks
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: bald_bookmarks
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmarks -d bald_bookmarks"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
