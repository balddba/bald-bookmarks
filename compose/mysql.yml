# Local MySQL for functional driver tests. Credentials are placeholders.
name: bald-bookmarks-mysql-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: bald_bookmarks
      MYSQL_USER: bookmarks
      MYSQL_PASSWORD: changeme
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-ubookmarks",
          "-pchangeme",
        ]
      interval: 3s
      timeout: 5s
      retries: 25
      start_period: 15s
