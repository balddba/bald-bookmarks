services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bald-bookmarks-api
    restart: unless-stopped
    environment:
      DB_DRIVER: ${DB_DRIVER:-memory}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_DSN: ${ORACLE_DSN:-}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-5}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      MEDIA_ROOT: /data/media
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      THUMBNAIL_VIEWPORT_WIDTH: ${THUMBNAIL_VIEWPORT_WIDTH:-1280}
      THUMBNAIL_VIEWPORT_HEIGHT: ${THUMBNAIL_VIEWPORT_HEIGHT:-720}
      THUMBNAIL_TIMEOUT_MS: ${THUMBNAIL_TIMEOUT_MS:-20000}
      THUMBNAIL_NO_SANDBOX: ${THUMBNAIL_NO_SANDBOX:-true}
    volumes:
      - media_data:/data/media
    ports:
      - "${API_PORT:-8081}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bald-bookmarks-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
#    ports:
#      - "${WEB_PORT:-8080}:80"
    networks:
      - default
      - proxy-net

volumes:
  media_data:

networks:
  proxy-net:
    name: proxy-net
    external: true
